name: Deploy Binance Collector (Self-hosted)

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        # Собираем имя образа вручную, приводя к нижнему регистру
        IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/binance-collector" | tr '[:upper:]' '[:lower:]')
        
        # Собираем и пушим образ с этим тегом
        docker build -t $IMAGE_TAG:latest .
        docker push $IMAGE_TAG:latest

    - name: Deploy with Docker Compose
      run: |
        cd /opt/BinanceCollector
        # Используем тот же метод для получения имени образа
        IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/binance-collector" | tr '[:upper:]' '[:lower:]')
        
        docker pull $IMAGE_TAG:latest
        docker compose up -d