name: Build and Deploy to Production

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: List files for debugging
        run: ls -R

      - name: Set up Docker image names
        id: image_names
        run: |
          echo "WORKER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/worker" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "DATAMANAGER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/datamanager" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Worker image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest --target worker
          docker push ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest

      - name: Build and push DataManager image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest --target datamanager
          docker push ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest

      - name: Prepare deployment directory
        run: |
          cp docker-compose.prod.yml /opt/BinanceCollector/docker-compose.yml
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > /opt/BinanceCollector/.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /opt/BinanceCollector/.env
          echo "ACME_EMAIL=${{ secrets.ACME_EMAIL }}" >> /opt/BinanceCollector/.env

      - name: Deploy with Docker Compose
        working-directory: /opt/BinanceCollector # <-- Указываем, где выполнять команды
        run: |
          docker compose pull
          docker compose up -d