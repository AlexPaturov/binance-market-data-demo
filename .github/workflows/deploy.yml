name: Build and Deploy to Production

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files for debugging
        run: ls -R

      - name: Set up Docker image names
        id: image_names
        run: |
          echo "WORKER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/worker" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "DATAMANAGER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/datamanager" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Worker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build . --file docker/Dockerfile --tag ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest --target worker
          docker push ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest

      - name: Build and push DataManager image
        working-directory: ${{ github.workspace }}
        run: |
          docker build . --file docker/Dockerfile --tag ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest --target datamanager
          docker push ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest

      - name: Deploy to Server
        run: |
          # 1. Копируем правильный compose-файл
          cp ${{ github.workspace }}/docker/compose/docker-compose.prod.yml /opt/BinanceCollector/docker/compose/docker-compose.prod.yml


          # 2. Переходим в директорию деплоя
          cd /opt/BinanceCollector/docker/compose

          # 3. Создаем .env файл с секретами
          cat > .env << EOF
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST=bdc_pgbouncer
          POSTGRES_DB=market_analytics
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          SERILOG_SEQ_URL=http://seq:5341
          SEQ_ADMIN_USER=lex
          SEQ_ADMIN_PASS=lex
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_PORT=5672
          RABBITMQ_HOSTNAME=bdc_rabbitmq
          EOF

          # 4. Проверяем содержимое .env (для отладки, потом можно удалить)
          echo "=== .env file created ==="
          cat .env | sed 's/PASSWORD=.*/PASSWORD=***HIDDEN***/'

          # 5. Скачиваем свежие образы и перезапускаем сервисы
          docker compose pull
          docker compose up -d