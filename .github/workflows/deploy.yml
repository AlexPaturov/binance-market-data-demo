name: Build and Deploy to Production

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: List files for debugging
        run: ls -R

      - name: Set up Docker image names
        id: image_names
        run: |
          echo "WORKER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/worker" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "DATAMANAGER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/datamanager" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Worker image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest --target worker
          docker push ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest

      - name: Build and push DataManager image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest --target datamanager
          docker push ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest

      - name: Deploy to Server
        run: |
          # 1. Копируем правильный compose-файл
          cp ${{ github.workspace }}/docker-compose.prod.yml /opt/BinanceCollector/docker-compose.yml
          
          # 2. Переходим в директорию деплоя
          cd /opt/BinanceCollector
          
          # 3. Создаем .env файл с секретами
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "ACME_EMAIL=${{ secrets.ACME_EMAIL }}" >> .env

          # 4. Скачиваем свежие образы и перезапускаем сервисы
          docker compose --env-file .env pull
          docker compose --env-file .env up -d