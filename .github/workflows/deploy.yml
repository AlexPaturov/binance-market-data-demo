name: Deploy Binance Collector (Self-hosted)

on:
  push:
    branches: [ "master" ]

jobs:
  # Мы определяем только одно задание, которое делает всё
  build-and-deploy:
    # Запускаем эту задачу на наших собственных раннерах
    runs-on: self-hosted

    steps:
    - name: Checkout code
      # Этот action скачивает ваш исходный код в рабочую папку раннера
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      # Логинимся в хранилище образов, чтобы потом запушить туда наш образ
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      # Этот action автоматически генерирует правильные теги для образа
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/binance-collector

    - name: Build and push Docker image
      # Собираем и пушим образ в GitHub Container Registry
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy with Docker Compose
      # Выполняем команды на сервере для развертывания
      run: |
        # Переходим в папку, где лежит наш docker-compose.yml
        cd /opt/BinanceCollector
        # Docker Compose сам скачает свежую версию образа и перезапустит контейнер
        docker-compose up -d --remove-orphans