name: CI and Deploy to Production

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BinanceDataCollector.sln

      - name: Build
        run: dotnet build BinanceDataCollector.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BinanceDataCollector.sln --configuration Release --no-build --verbosity normal

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate app version
        id: version
        run: |
          echo "APP_VERSION=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker image names
        id: image_names
        run: |
          echo "WORKER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/worker" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "DATAMANAGER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/datamanager" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build . \
            --file docker/Dockerfile \
            --tag ${{ steps.image_names.outputs.WORKER_IMAGE }}:${{ steps.version.outputs.APP_VERSION }} \
            --target worker

          docker push ${{ steps.image_names.outputs.WORKER_IMAGE }}:${{ steps.version.outputs.APP_VERSION }}

      - name: Build and push DataManager image
        working-directory: ${{ github.workspace }}
        run: |
          docker build . \
            --file docker/Dockerfile \
            --tag ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:${{ steps.version.outputs.APP_VERSION }} \
            --target datamanager

          docker push ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:${{ steps.version.outputs.APP_VERSION }}

      - name: Deploy to Server
        run: |
          # 1. Копируем правильный compose-файл
          cp ${{ github.workspace }}/docker/compose/docker-compose.prod.yml /opt/BinanceCollector/docker/compose/docker-compose.prod.yml

          # 2. Переходим в директорию деплоя
          cd /opt/BinanceCollector/docker/compose

          # 3. Создаем .env файл с секретами
          cat > .env << EOF
          APP_VERSION=${{ steps.version.outputs.APP_VERSION }}
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST=bdc_pgbouncer
          POSTGRES_DB=market_analytics
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          SERILOG_SEQ_URL=http://seq:5341
          SEQ_ADMIN_USER=lex
          SEQ_ADMIN_PASS=lex
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_PORT=5672
          RABBITMQ_HOST=bdc_rabbitmq
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          AUTH_B2C_CLIENTID=${{ secrets.AUTH_B2C_CLIENTID }}
          AUTH_B2C_CLIENT_SECRET=${{ secrets.AUTH_B2C_CLIENT_SECRET }}
          EOF

          # 4. Создаем контракты
          echo "Ensuring persistent volumes exist..."
          docker volume create binancecollector_postgres_data || true
          docker volume create binancecollector_seq_data || true
          docker volume create binancecollector_rabbitmq_data || true
          docker volume create binancecollector_letsencrypt_data || true
          docker volume create binancecollector_bdc_data || true
          docker volume create binancecollector_uptime_kuma_data || true

          echo "Ensuring persistent networks exist..."
          docker network create binancecollector_web || true
          docker network create internal_network || true

          # 5. Скачиваем свежие образы и перезапускаем сервисы
          docker compose pull
          docker compose up -d
