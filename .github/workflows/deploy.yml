name: Build and Deploy to Production

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker image names
        id: image_names
        run: |
          echo "WORKER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/worker" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "DATAMANAGER_IMAGE=ghcr.io/alexpaturov/binancedatacollector/datamanager" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Worker image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest --target worker
          docker push ${{ steps.image_names.outputs.WORKER_IMAGE }}:latest

      - name: Build and push DataManager image
        run: |
          docker build . --file Dockerfile --tag ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest --target datamanager
          docker push ${{ steps.image_names.outputs.DATAMANAGER_IMAGE }}:latest

      - name: Create .env file for Docker Compose
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "ACME_EMAIL=${{ secrets.ACME_EMAIL }}" >> .env

      - name: Deploy with Docker Compose
        # Этот шаг выполняется в рабочей директории runner'а, где лежат все файлы из репозитория
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d