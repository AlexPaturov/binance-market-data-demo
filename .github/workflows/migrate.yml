name: Apply DB migrations to production

# Накат миграций отделён от деплоя кода: оператор жмёт кнопку, когда готов
# (притушил нагрузку / вне пика). Идёт на self-hosted раннере прямо в контейнер bdc_db.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введи APPLY, чтобы подтвердить накат миграций на прод'
        required: true
        default: ''

jobs:
  migrate-prod:
    if: ${{ github.event.inputs.confirm == 'APPLY' }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy migration set into bdc_db
        run: docker cp docker/postgres bdc_db:/tmp/pg

      # Журнал schema_migrations должен существовать (одноразовый бутстрап проведён).
      # Иначе migrate.sh счёл бы прод пустым и попытался накатить всю историю заново.
      - name: Guard — schema_migrations must exist
        run: |
          exists=$(docker exec bdc_db psql -U ${{ secrets.DB_USER }} -d market_analytics -tAc \
            "SELECT to_regclass('public.\"schema_migrations\"') IS NOT NULL")
          if [ "$exists" != "t" ]; then
            echo "::error::На проде нет schema_migrations — сначала одноразовый бутстрап (фаза 6)."
            exit 1
          fi
          echo "Уже применено на проде:"
          docker exec bdc_db psql -U ${{ secrets.DB_USER }} -d market_analytics -tAc \
            'SELECT "Version" FROM public."schema_migrations" ORDER BY "Version"'

      - name: Apply pending migrations
        run: |
          docker exec \
            -e PGUSER=${{ secrets.DB_USER }} \
            -e PGDATABASE=market_analytics \
            -e MIGRATIONS_DIR=/tmp/pg/migrations \
            -e MIGRATE_LOCK_TIMEOUT=3s \
            -e MIGRATE_STATEMENT_TIMEOUT=1h \
            bdc_db bash /tmp/pg/migrate.sh

      - name: Cleanup
        if: always()
        run: docker exec bdc_db rm -rf /tmp/pg || true
