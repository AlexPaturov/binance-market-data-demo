services:
  db:
    image: postgres:16-alpine
    container_name: binance_postgres
    restart: always
    environment:
      - POSTGRES_USER=bindatacoll
      - POSTGRES_PASSWORD=dt_hfgd_yyyd
      - POSTGRES_DB=market_analytics
      - POSTGRES_INITDB_ARGS=--auth-host=md5
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindatacoll -d market_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: binance_seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: binance_rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/

volumes:
  postgres_data:
  seq_data:
  rabbitmq_data: