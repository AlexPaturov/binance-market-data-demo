[databases]
market_analytics = host=db port=5432 dbname=market_analytics
market_analytics_jobs = host=db port=5432 dbname=market_analytics_jobs

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
default_pool_size = 100
max_client_conn = 10000
admin_users = postgres,bindatacoll
stats_users = postgres,bindatacoll
server_reset_query = DISCARD ALL

;; Дополнительные рекомендуемые параметры
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
server_lifetime = 3600
server_idle_timeout = 600
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Для работы с prepared statements
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits
