# --- СЕТИ ---
# Объявляем сети, которые будут использовать наши сервисы.
# 'internal_network' - для связи между сервисами, полностью изолирована от внешнего мира.
# 'web' - для связи с обратным прокси Traefik.
networks:
  web:
    external: true
    name: binancecollector_web
  internal_network:
    external: true
    name: internal_network

services:
  
  # --- UPTIME MONITORING ---
  uptime_kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=binancecollector_web"
      - "traefik.http.routers.kuma.rule=Host(`status.jahasim.com`)"
      - "traefik.http.routers.kuma.entrypoints=web"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
  
  # --- ОБРАТНЫЙ ПРОКСИ ---
  # Единая точка входа для всего трафика. Управляет SSL и маршрутизацией.
  traefik:
    image: traefik:v2.10
    container_name: traefik
    hostname: traefik
    restart: always
    command:
      - "--api.insecure=true" # Включаем дашборд (для отладки)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false" # Явно указываем, какие сервисы выставлять наружу
      - "--entrypoints.web.address=:80" # Открываем порт 80
      - "--entrypoints.websecure.address=:443" # --- Здесь будут настройки для SSL, когда мы их добавим ---
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}" # Передается из Secrets
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true" # Включаем логи
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Дашборд будет доступен на порту 8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # Traefik читает метаданные Docker
      - "letsencrypt_data:/letsencrypt"
    networks:
      - web
      - internal_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run --protocol http2
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - web
    depends_on:
      - traefik

  # --- БАЗА ДАННЫХ ---
  bdc_db:
    # Свой образ: postgres:16 (Debian) + pg_cron. Эвакуацию партиций планирует сама БД,
    # не приложение (docker/postgres/Dockerfile).
    build:
      context: ../postgres
      dockerfile: Dockerfile
    image: bdc/postgres-cron:16
    container_name: bdc_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=market_analytics
      # Коллация C.UTF-8: байтовый порядок сравнения, одинаковый на любой libc —
      # текстовые индексы больше не привязаны к musl/glibc, база переносима между
      # образами. Действует только на чистой инициализации.
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8
    volumes:
      # Горячие данные (каталоги, WAL, активные партиции) — на внутреннем SSD:
      # случайный доступ, которым живёт конвейер, требует IOPS, а не мегабайт в секунду.
      - /opt/BinanceCollector/pgdata:/var/lib/postgresql/data
      # Холодное табличное пространство — на внешнем HDD: закрытые месяцы Trades
      # переезжают сюда одним последовательным копированием (pg_cron →
      # sp_evacuate_next_cold_partition). Отключён диск — свежие данные работают,
      # запросы за старые периоды падают с ошибкой undefined_file.
      - /mnt/ext/pg_tablespaces:/mnt/pg_tablespaces
      # Init-скрипты отрабатывают только на чистой инициализации: схема, схема Hangfire,
      # холодное пространство, расширение pg_cron и расписание эвакуации.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
      # pg_cron грузится только через preload; планировщик работает в БД данных.
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=market_analytics"
    networks:
      - internal_network # База данных подключена к внутренней сети
    ports:
      - "100.96.120.16:5432:5432" # Проброс во внешнюю для dbeaver 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d market_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- СЕРВЕР ЛОГОВ ---
  bdc_seq:
    image: datalust/seq:latest
    container_name: bdc_seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USER}
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASS}
    volumes:
      - seq_data:/data
    networks:
      - web              # ...и через Traefik
      - internal_network # Seq доступен только из внутренней сети...
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=binancecollector_web"
      - "traefik.http.routers.seq.rule=Host(`seq.jahasim.com`)"
      - "traefik.http.routers.seq.entrypoints=web,websecure"
      - "traefik.http.services.seq.loadbalancer.server.port=80"

  # --- БРОКЕР СООБЩЕНИЙ ---
  bdc_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bdc_rabbitmq
    restart: always
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - RabbitMQ__HostName=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    networks:
      - internal_network

  bdc_pgbouncer:
    image: edoburu/pgbouncer
    container_name: bdc_pgbouncer
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h bdc_pgbouncer -p 6432 -U ${POSTGRES_USER}" ]
      interval: 3s
      timeout: 2s
      retries: 10
    depends_on:
      - bdc_db  
    networks:
      - internal_network # pgbouncer должен быть только во внутренней сети
    ports:
      - "6432:6432"
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=bdc_db
      - DB_PORT=5432
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=100
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=10
      - AUTH_TYPE=scram-sha-256

  bdc_worker:
    image: ghcr.io/alexpaturov/binancedatacollector/worker:${APP_VERSION}
    container_name: bdc_worker
    restart: always
    depends_on:
      bdc_pgbouncer:
        condition: service_healthy
      bdc_rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__HangfireConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics_jobs;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Слушатели NOTIFY идут в базу напрямую: PgBouncer в режиме transaction возвращает
      # серверное соединение в пул после каждой транзакции, и регистрация LISTEN до него
      # не доживает. Два долгоживущих соединения; вся остальная работа — через пул.
      - ConnectionStrings__DirectConnection=Host=bdc_db;Port=5432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://bdc_seq:80
    networks:
      - web
      - internal_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=binancecollector_web"
      - "traefik.http.routers.worker.rule=Host(`worker.jahasim.com`)"
      - "traefik.http.routers.worker.entrypoints=web,websecure"
      - "traefik.http.services.worker.loadbalancer.server.port=8080"
      - "traefik.http.routers.hangfire.rule=Host(`hangfire.jahasim.com`)"
      - "traefik.http.routers.hangfire.entrypoints=web,websecure"
      - "traefik.http.routers.hangfire.service=worker"
    volumes:
      - bdc_data:/opt/bdc_data

  bdc_datamanager:
    image: ghcr.io/alexpaturov/binancedatacollector/datamanager:${APP_VERSION}
    container_name: bdc_datamanager
    restart: always
    depends_on:
      bdc_pgbouncer:
        condition: service_healthy
      bdc_rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__HangfireConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics_jobs;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://bdc_seq:80
      - Authentication__B2C__ClientId=${AUTH_B2C_CLIENTID}
      - Authentication__B2C__ClientSecret=${AUTH_B2C_CLIENT_SECRET}
    networks:
      - web
      - internal_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=binancecollector_web"
      - "traefik.http.routers.datamanager.rule=Host(`datamanager.jahasim.com`)"
      - "traefik.http.routers.datamanager.entrypoints=web,websecure"
      - "traefik.http.services.datamanager.loadbalancer.server.port=8080"
    volumes:
      - bdc_data:/opt/bdc_data

volumes:
  seq_data:
    external: true
    name: binancecollector_seq_data
  rabbitmq_data:
    external: true
    name: binancecollector_rabbitmq_data
  letsencrypt_data:
    external: true
    name: binancecollector_letsencrypt_data
  bdc_data:
    external: true
    name: binancecollector_bdc_data
  uptime_kuma_data:
    external: true
    name: binancecollector_uptime_kuma_data
