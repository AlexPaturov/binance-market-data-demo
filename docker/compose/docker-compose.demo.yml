# Demo-окружение: самодостаточный стек. `git clone` → одна команда → http://localhost:7002
# с уже наполненной БД (BTCUSDT, февраль 2026), без Binance и без внешнего провайдера входа.
#
#   cp .env.example .env         # значения по умолчанию годятся для demo
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Все образы поддерживают amd64 и arm64 (в т.ч. Apple Silicon).

services:
  bdc_db:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    image: bdc/postgres-cron:16
    container_name: bdc_demo_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=market_analytics
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8
      # Каталог с seed-данными (*.csv.gz) для load-seed.sh — см. монтирование ниже.
      - SEED_DATA_DIR=/seed
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=market_analytics"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      # Холодное табличное пространство — именованный том (переносимо между ОС, в отличие
      # от bind-mount, где chown внутри контейнера ломается на Windows/macOS).
      - demo_cold:/mnt/pg_tablespaces
      # Инициализация чистого тома: схема + Hangfire + cold/pg_cron (01–04), затем seed (05).
      # 05_seed.sh уже в init/ и грузит данные, когда задан SEED_DATA_DIR (см. environment).
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../postgres/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d market_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  bdc_pgbouncer:
    image: edoburu/pgbouncer
    container_name: bdc_demo_pgbouncer
    restart: unless-stopped
    depends_on:
      bdc_db:
        condition: service_healthy
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=bdc_db
      - DB_PORT=5432
      # Порт самого pgbouncer: worker/datamanager и healthcheck ходят на 6432.
      # Без этого образ слушает дефолтный 5432 — healthcheck и коннекты не проходят.
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=100
      - AUTH_TYPE=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bdc_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bdc_demo_rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - demo_rabbitmq_data:/var/lib/rabbitmq

  bdc_seq:
    image: datalust/seq:latest
    container_name: bdc_demo_seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80" # веб-интерфейс логов (по желанию)
    volumes:
      - demo_seq_data:/data

  bdc_worker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: worker
    image: bdc/worker:demo
    container_name: bdc_demo_worker
    restart: unless-stopped
    depends_on:
      bdc_pgbouncer:
        condition: service_healthy
      bdc_rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Demo
      - ASPNETCORE_URLS=http://0.0.0.0:7001
      # Автономный режим: без сбора из Binance. Данные — из seed, обработка событийная.
      - Collectors__Enabled=false
      - ArchivesSettings__BasePath=/opt/bdc_data
      - ConnectionStrings__DefaultConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__HangfireConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics_jobs;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Слушатели NOTIFY идут напрямую в БД мимо PgBouncer (transaction-режим рвёт LISTEN).
      - ConnectionStrings__DirectConnection=Host=bdc_db;Port=5432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=bdc_rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - Serilog__WriteTo__1__Args__serverUrl=http://bdc_seq:5341
    volumes:
      - demo_bdc_data:/opt/bdc_data

  bdc_datamanager:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: datamanager
    image: bdc/datamanager:demo
    container_name: bdc_demo_datamanager
    restart: unless-stopped
    depends_on:
      bdc_pgbouncer:
        condition: service_healthy
      bdc_rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Demo
      - ASPNETCORE_URLS=http://0.0.0.0:7002
      # Локальный вход с выбором роли вместо Azure B2C.
      - Authentication__Mode=Demo
      - ConnectionStrings__DefaultConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__HangfireConnection=Host=bdc_pgbouncer;Port=6432;Database=market_analytics_jobs;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=bdc_rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    ports:
      - "7002:7002" # веб-интерфейс DataManager
    volumes:
      - demo_bdc_data:/opt/bdc_data

volumes:
  demo_postgres_data:
  demo_cold:
  demo_seq_data:
  demo_rabbitmq_data:
  demo_bdc_data:
