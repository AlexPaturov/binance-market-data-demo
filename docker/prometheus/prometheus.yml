# Prometheus — сбор метрик прод-конвейера BinanceDataCollector.
# Скрейпит: сам себя, хост (node_exporter), обе БД (два postgres_exporter).
global:
  scrape_interval: 30s          # прикладные SQL-запросы недёшевы на больной очереди — не частим
  scrape_timeout: 20s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    scrape_interval: 15s        # железо дёшево опрашивать, диск смотрим чаще
    static_configs:
      - targets: ["bdc_node_exporter:9100"]

  # market_analytics: очередь минут, отставание свечей и фич
  - job_name: postgres_bdc
    static_configs:
      - targets: ["bdc_pg_exporter:9187"]

  # market_analytics_jobs: успех/провал и длительность проходов агрегации
  - job_name: postgres_jobs
    static_configs:
      - targets: ["bdc_pg_exporter_jobs:9187"]
