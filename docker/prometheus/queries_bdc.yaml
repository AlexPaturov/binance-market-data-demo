# Прикладные метрики из market_analytics. Читаются postgres_exporter'ом на каждый скрейп.
# Имя метрики = ключ верхнего уровня + имя колонки: bdc_dirty_minutes + depth = bdc_dirty_minutes_depth.

bdc_dirty_minutes:
  query: 'SELECT count(*) AS depth FROM public."DirtyMinutes"'
  metrics:
    - depth:
        usage: "GAUGE"
        description: "Минут в очереди на агрегацию свечей. Норма — десятки; сотни тысяч — разбор хвоста."

# Отставание живой свечи: сколько секунд назад закрыта последняя посчитанная минута.
# max(OpenTime) по партиционированной таблице берётся index-scan'ом, дёшево.
bdc_candle:
  query: >
    SELECT EXTRACT(EPOCH FROM now())::bigint - COALESCE(max("OpenTime") / 1000, EXTRACT(EPOCH FROM now())::bigint)
    AS lag_seconds FROM public."Ohlcv_1min"
  metrics:
    - lag_seconds:
        usage: "GAUGE"
        description: "Секунд отставания свежайшей свечи от текущего времени."

# Отставание индикаторов — следующее звено после свечей.
bdc_feature:
  query: >
    SELECT EXTRACT(EPOCH FROM now())::bigint - COALESCE(max("OpenTime") / 1000, EXTRACT(EPOCH FROM now())::bigint)
    AS lag_seconds FROM public."Ohlcv_Features"
  metrics:
    - lag_seconds:
        usage: "GAUGE"
        description: "Секунд отставания свежайшей строки фич (из неё берётся CVD графика)."

# Темп конвейера. Событийные потребители работают непрерывными кусками, а не джобами,
# поэтому их здоровье измеряется потоком строк: счётчики Postgres по таблицам,
# rate() в Grafana превращает их в строки-в-минуту.
#   minutes_in_total  — вставка тиков поставила минуты в очередь (приток);
#   minutes_out_total — агрегация сняла минуты с очереди (слив);
#   candles_written_total / features_written_total — записанные свечи и фичи.
# Свечи и фичи партиционированы — счётчики суммируются по партициям.
bdc_pipeline:
  query: >
    SELECT
      (SELECT n_tup_ins FROM pg_stat_user_tables WHERE relname = 'DirtyMinutes')  AS minutes_in_total,
      (SELECT n_tup_del FROM pg_stat_user_tables WHERE relname = 'DirtyMinutes')  AS minutes_out_total,
      (SELECT COALESCE(sum(n_tup_ins + n_tup_upd), 0) FROM pg_stat_user_tables
        WHERE relname LIKE 'Ohlcv\_1min\_%')                                      AS candles_written_total,
      (SELECT COALESCE(sum(n_tup_ins + n_tup_upd), 0) FROM pg_stat_user_tables
        WHERE relname LIKE 'Ohlcv\_Features\_%')                                  AS features_written_total
  metrics:
    - minutes_in_total:
        usage: "COUNTER"
        description: "Минут поставлено в очередь агрегации (нарастающий счётчик)."
    - minutes_out_total:
        usage: "COUNTER"
        description: "Минут снято с очереди агрегацией (нарастающий счётчик)."
    - candles_written_total:
        usage: "COUNTER"
        description: "Свечей записано/пересчитано (нарастающий счётчик, по всем партициям)."
    - features_written_total:
        usage: "COUNTER"
        description: "Строк фич записано/обновлено (нарастающий счётчик, по всем партициям)."
