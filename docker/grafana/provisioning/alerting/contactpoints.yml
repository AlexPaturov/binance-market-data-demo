# Доставка алертов в Telegram. Grafana шлёт sendMessage от имени бота — никакого
# своего кода или контейнера, бот существует только как токен.
# Токен живёт в серверном .env и попадает сюда через окружение контейнера
# (см. bdc_grafana в docker-compose.monitoring.prod.yml) — в репозитории его нет.
# chat_id задан литералом: значение из окружения Grafana после подстановки считает
# числом и валит провижининг («cannot unmarshal number into ... chatid of type
# string»), а строкой в файле оно проходит. Секретом chat_id не является — без
# токена бота он бесполезен.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: bdc-telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "5941584954"
