# Маршрутизация уведомлений: всё — в Telegram (contact point из contactpoints.yml).
# repeat_interval 4h — пока алерт горит, напоминание раз в четыре часа, а не каждую минуту.
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
