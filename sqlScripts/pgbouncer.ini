[databases]
market_analytics = host=db port=5432 dbname=market_analytics
market_analytics_jobs = host=db port=5432 dbname=market_analytics_jobs

[pgbouncer]
listen_addr = *
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 100
max_client_conn = 10000

admin_users = postgres, bindatacoll
stats_users = postgres, bindatacoll

server_reset_query = DISCARD ALL

