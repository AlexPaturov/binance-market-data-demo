services:
  db: # Дополняем сервис db
    ports:
      - "5432:5432" # Открываем порт для DBeaver

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: binance_pgbouncer
    restart: always
    depends_on:
      - db
    ports:
      - "6432:5432"
    environment:
      - DB_USER=bindatacoll
      - DB_PASSWORD=dt_hfgd_yyyd
      - DB_HOST=db
      - DB_PORT=5432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=100
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=10
      - AUTH_TYPE=md5

  seq: # Дополняем сервис seq
    ports:
      - "5341:80" # Открываем порт для UI

  rabbitmq: # Дополняем сервис rabbitmq
    ports:
      - "5672:5672"   # Порт для подключения
      - "15672:15672" # Порт для UI

  worker: # Добавляем сервис worker
    container_name: bdc_worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started # У RabbitMQ нет healthcheck по умолчанию, ждем старта
    ports:
      - "7001:7001" # Для дашборда Hangfire
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=market_analytics;Username=bindatacoll;Password=dt_hfgd_yyyd
      - ConnectionStrings__HangfireConnection=Host=db;Port=5432;Database=market_analytics_jobs;Username=bindatacoll;Password=dt_hfgd_yyyd
      - RabbitMQ__HostName=rabbitmq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq

  datamanager: # Добавляем сервис datamanager
    container_name: bdc_datamanager
    build:
      context: .
      dockerfile: Dockerfile
      target: datamanager
    depends_on:
      - db
      - rabbitmq
    ports:
      - "7002:7002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=market_analytics;Username=bindatacoll;Password=dt_hfgd_yyyd
      - RabbitMQ__HostName=rabbitmq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq